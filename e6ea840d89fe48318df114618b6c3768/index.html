<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" sizes="32x32" href="./images/logo2.PNG">
  <link rel="icon" type="image/jpeg" sizes="16x16" href="./images/logo2.PNG">
  <link rel="apple-touch-icon" href="./images/logo2.PNG">
  <title>Eugene Wallace</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue-dark: #00738b;
      --blue-mid: #0091AD;
      --blue-light: #57c0dd;
      --white: #ffffff;
      --text-dark: #0f1e3c;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-hover: rgba(255, 255, 255, 0.95);
      --shadow: 0 4px 24px rgba(0, 145, 173, 0.13);
      --shadow-hover: 0 8px 32px rgba(0, 145, 173, 0.22);
      --radius: 14px;
    }

    html,
    body {
      min-height: 100vh;
      font-family: 'Jost', sans-serif;
      background: linear-gradient(135deg, #dbeeff 0%, #f0f8ff 40%, #d6eaf8 100%);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slider-wrap {
      width: 100%;
      position: relative;
      height: 340px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(26, 58, 107, 0.2);
      background: #0a1628;
    }

    .slides {
      display: flex;
      height: 100%;
      transition: transform 0.55s ease;
    }

    .slide {
      min-width: 100%;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* DOTS */
    .slider-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      z-index: 10;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.42);
      cursor: pointer;
    }

    .dot.active {
      background: #fff;
      transform: scale(1.3);
    }

    /* PROFILE */
    .profile {
      display: flex;
      padding: 26px 20px 0;
      text-align: center;
      flex-direction: row;
      align-items: center;
      margin-bottom: 10px;
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.55rem, 6vw, 2rem);
      font-weight: 700;
    }

    .tagline {
      margin-top: 6px;
      font-family: 'Playfair Display', serif;
      font-size: 0.83rem;
      letter-spacing: 0.16em;
      text-transform: capitalize;
      color: var(--blue-mid);
    }

    .links {
      width: 100%;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.97rem;
      font-weight: 500;
    }

    .footer {
      margin-top: 44px;
      font-size: 0.74rem;
      color: var(--blue-mid);
      text-align: center;
    }

    @media (max-width: 380px) {
      .slider-wrap {
        height: 260px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- SLIDER -->
    <div class="slider-wrap">
      <div class="slides" id="slides">
        <div class="slide"><img src="./images/img1.jpg" style="height: 127%;"></div>
        <div class="slide"><img src="./images/img3.jpeg" style="height: 125%;"></div>
        <div class="slide"><img src="./images/img5.jpeg"></div>
        <div class="slide"><img src="./images/img2.jpeg" style="height: 137%;"></div>
        <div class="slide"><img src="./images/img4.jpg"></div>
      </div>

      <div class="slider-dots">
        <button class="dot active" data-i="0"></button>
        <button class="dot" data-i="1"></button>
        <button class="dot" data-i="2"></button>
        <button class="dot" data-i="3"></button>
        <button class="dot" data-i="4"></button>
        <!-- <button class="dot" data-i="5"></button> -->
      </div>
    </div>

    <!-- PROFILE -->
    <div class="profile">
      <img src="./images/logo2.PNG" width="68" height="68" style="border-radius:50%; margin-bottom:16px;">
      <div>
        <h2 class="name">Dr. Eugene Wallace Jr.</h2>
        <p class="tagline">Educator | Leadership Strategist | Acclaimed Author | Keynote Speaker</p>
      </div>
    </div>

    <!-- LINKS -->
    <div class="links">
      <a class="link-btn" href="https://eugenespeaks.com/about/">About Me</a>
      <a class="link-btn" href="https://www.instagram.com/docwallaceofficial?igsh=MWg2bHBvOGU0dnh2">Instagram</a>
      <a class="link-btn" href="https://x.com/eugenewallace15?s=11">X (Twitter)</a>
      <a class="link-btn" href="https://www.linkedin.com/in/eugene-wallace-phd-250b69404/">LinkedIn</a>
      <a class="link-btn" href="https://eugenespeaks.com/">Visit My Bookstore</a>
    </div>

    <p class="footer">© 2026 Eugene Wallace</p>
  </div>

  <script>
    const track = document.getElementById('slides');
    const dots = document.querySelectorAll('.dot');
    let cur = 0;
    const TOTAL = 5; // Update this if you add/remove slides

    function goTo(n) {
      cur = (n + TOTAL) % TOTAL;
      track.style.transform = `translateX(-${cur * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === cur));
    }

    dots.forEach(d => d.onclick = () => goTo(+d.dataset.i));

    setInterval(() => goTo(cur + 1), 3000);
  </script>
</body>

</html>
